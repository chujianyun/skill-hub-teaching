name: skill-hub-teaching
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skill_hub_demo
    volumes:
      - demo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_hub_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skill_hub_demo
      PORT: "3000"
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - demo_packages:/app/private-uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy
volumes:
  demo_db:
  demo_packages:
